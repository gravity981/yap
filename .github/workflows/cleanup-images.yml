name: Clean up images

# Images built from main are kept for 30 days; release candidates and releases forever
# (spec 5.3).
on:
  schedule:
    - cron: "17 3 * * 1" # Mondays, 03:17 UTC
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Only list what would be deleted"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    name: Delete expired main images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Delete images older than 30 days
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/cleanup_images.py ${{ inputs.dry-run && '--dry-run' || '' }}
